<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#B91C1C">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PressNex">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>PressNex</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="style.css?v=20261108-1705">
<script>
  // Fehleranzeige: zeigt Startprobleme direkt auf der Seite an (statt endlos zu laden)
  window.__pnErrors = [];
  function pnShowError(msg) {
    window.__pnErrors.push(String(msg));
    var box = document.getElementById("pn-diag");
    if (!box) return;
    box.style.display = "block";
    box.textContent = "Fehler beim Start:\n" + window.__pnErrors.join("\n");
  }
  window.addEventListener("error", function (e) {
    pnShowError((e.message || "Ladefehler") + (e.filename ? " – " + e.filename.split("/").pop() + ":" + e.lineno : "") + (e.target && e.target.src ? " – " + e.target.src : ""));
  }, true);
  window.addEventListener("unhandledrejection", function (e) { pnShowError(e.reason && (e.reason.message || e.reason) || "Unbekannter Fehler"); });
  setTimeout(function () {
    if (!window.__pnStarted) pnShowError((window.__pnModule ? "App-Code geladen, aber Firebase-Anmeldung antwortet nicht." : "App-Code wurde nicht geladen (Datei fehlt oder Firebase-Bibliothek nicht erreichbar).") + " (Browser: " + navigator.userAgent + ")");
  }, 12000);
</script>
</head>
<body>
<div id="app" aria-live="polite">
  <div class="splash"><div class="logo-badge big">PN</div><p>PressNex wird geladen …</p></div>
</div>
<pre id="pn-diag" style="display:none;margin:16px;padding:12px;border-radius:12px;background:#FEF2F2;color:#991B1B;white-space:pre-wrap;font-size:13px"></pre>
<div id="toast" role="status" aria-live="polite"></div>
<noscript>PressNex benötigt JavaScript.</noscript>
<script type="module" src="app.js?v=20261108-1705"></script>
</body>
</html>
